name: CI/CD AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: oficina-mecanica-eks
  ECR_REPOSITORY: oficina-mecanica

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OficinaMecanica.slnx
      - name: Build
        run: dotnet build OficinaMecanica.slnx -c Release --no-restore
      - name: Test
        run: dotnet test OficinaMecanica.slnx -c Release --no-build --collect:"XPlat Code Coverage"

  publish-and-deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"
      - name: Apply Kubernetes resources and secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          DB_HOST=$(aws rds describe-db-instances --db-instance-identifier oficina-mecanica-postgres --query 'DBInstances[0].Endpoint.Address' --output text)
          kubectl apply -f k8s/namespace.yaml
          kubectl -n oficina-mecanica create secret generic oficina-secrets \
            --from-literal=database-host="$DB_HOST" \
            --from-literal=postgres-password="$POSTGRES_PASSWORD" \
            --from-literal=jwt-key="$JWT_KEY" \
            --from-literal=smtp-username="$SMTP_USERNAME" \
            --from-literal=smtp-password="$SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/api.yaml
          kubectl apply -f k8s/hpa.yaml
      - name: Deploy image and wait for rollout
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          kubectl -n oficina-mecanica set image deployment/oficina-api api="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          kubectl -n oficina-mecanica rollout status deployment/oficina-api --timeout=300s
          kubectl -n oficina-mecanica get service oficina-api
